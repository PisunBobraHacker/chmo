<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatGPT Detector</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Courier New', monospace;
        }
        .container {
            text-align: center;
        }
        .status {
            font-size: 200px;
            font-weight: bold;
            animation: pulse 1s infinite;
        }
        .status.ai {
            color: #ff0044;
        }
        .status.human {
            color: #00ff41;
        }
        .label {
            color: #666;
            font-size: 18px;
            margin-top: 20px;
            letter-spacing: 2px;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        .info {
            color: #444;
            font-size: 12px;
            margin-top: 30px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="status" id="status">?</div>
        <div class="label" id="label">ОПРЕДЕЛЕНИЕ...</div>
        <div class="info" id="info"></div>
    </div>

    <script>
        // ============================================================
        // ДЕТЕКТОР CHATGPT
        // ============================================================
        (function() {
            const statusEl = document.getElementById('status');
            const labelEl = document.getElementById('label');
            const infoEl = document.getElementById('info');
            
            let isAI = false;
            let reasons = [];
            
            // 1. Проверка User-Agent
            const ua = navigator.userAgent || '';
            if (/chatgpt|openai|gpt|ai|bot|crawl|spider/i.test(ua)) {
                isAI = true;
                reasons.push('User-Agent: ' + ua);
            }
            
            // 2. Проверка Referrer
            const referrer = document.referrer || '';
            if (/chat.openai.com|openai.com|chatgpt/i.test(referrer)) {
                isAI = true;
                reasons.push('Referrer: ' + referrer);
            }
            
            // 3. Проверка через navigator.webdriver (боты)
            if (navigator.webdriver === true) {
                isAI = true;
                reasons.push('navigator.webdriver = true');
            }
            
            // 4. Проверка через navigator.plugins (у ботов часто 0)
            if (navigator.plugins && navigator.plugins.length === 0) {
                isAI = true;
                reasons.push('navigator.plugins.length = 0');
            }
            
            // 5. Проверка через navigator.languages (у ботов часто только 1)
            if (navigator.languages && navigator.languages.length <= 1) {
                // Не всегда показатель, но для AI часто так
                // isAI = true;
                // reasons.push('navigator.languages.length <= 1');
            }
            
            // 6. Проверка через performance.memory (у ботов часто нет)
            if (!window.performance || !window.performance.memory) {
                // Не всегда показатель
            }
            
            // 7. Проверка через window.chrome (у AI часто нет)
            if (!window.chrome) {
                // Не всегда показатель
            }
            
            // 8. Проверка через navigator.hardwareConcurrency (у ботов часто 2 или 4)
            if (navigator.hardwareConcurrency && navigator.hardwareConcurrency <= 2) {
                // Не всегда показатель
            }
            
            // 9. Дополнительная проверка: если пришло из ChatGPT через плагин
            if (document.referrer && document.referrer.includes('chat.openai.com')) {
                isAI = true;
                reasons.push('Прямой переход из ChatGPT');
            }
            
            // ============================================================
            // ВЫВОД РЕЗУЛЬТАТА
            // ============================================================
            const statusEl = document.getElementById('status');
            const labelEl = document.getElementById('label');
            const infoEl = document.getElementById('info');
            
            if (isAI) {
                statusEl.textContent = '1';
                statusEl.className = 'status ai';
                labelEl.textContent = '🔴 ОБНАРУЖЕН AI (ChatGPT)';
                infoEl.textContent = 'Причины: ' + reasons.join('; ');
                infoEl.style.color = '#ff0044';
            } else {
                statusEl.textContent = '0';
                statusEl.className = 'status human';
                labelEl.textContent = '🟢 ЧЕЛОВЕК (не AI)';
                infoEl.textContent = 'Детектор не нашёл признаков AI';
                infoEl.style.color = '#00ff41';
            }
            
            // Логируем в консоль
            console.log('🔍 ДЕТЕКТОР CHATGPT');
            console.log('Результат:', isAI ? '1 (AI)' : '0 (Человек)');
            console.log('Причины:', reasons.length ? reasons : 'Не обнаружено');
            console.log('User-Agent:', navigator.userAgent);
            console.log('Referrer:', document.referrer || 'нет');
            
        })();
    </script>
</body>
</html>
